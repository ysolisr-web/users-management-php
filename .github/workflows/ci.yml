name: CI - PHP Hexagonal DDD & Docker

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  php-syntax-check:
    name: Validar sintaxis PHP (Capas Hexagonal y DDD)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, mbstring

      - name: Verificar sintaxis de todos los archivos PHP
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  docker-build-test:
    name: Construir imagen Docker (Integración)
    runs-on: ubuntu-latest
    needs: php-syntax-check

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir contenedor desde Dockerfile
        run: |
          docker build -t hexagonal-php-cursos:latest .